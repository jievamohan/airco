name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Volledige historie: een geheim dat later is weggehaald staat er nog
          # steeds in en moet alsnog gevonden worden.
          fetch-depth: 0

      - name: Gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

  api:
    name: API tests and static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sodium, zip, dom
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Code style
        run: vendor/bin/pint --test

      - name: Static analysis
        run: php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress

      - name: Tests
        run: vendor/bin/phpunit --no-coverage

      - name: Dependency audit
        run: composer audit --no-interaction --format=plain

  ci:
    name: Build and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --prod

      - name: Typecheck
        run: pnpm run typecheck

      - name: Generate static site
        env:
          # Site en API delen op productie één domein, dus de browser praat met
          # /api op dezelfde origin. Zelfde waarde als de deploy op de VPS.
          NUXT_PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE || '/api' }}
        run: pnpm run generate

      - name: Verify generate output
        run: |
          test -f .output/public/index.html
          test -d .output/public/_nuxt
          # Beide landingspagina's moeten in de build zitten: de tweede is een
          # statisch bestand in public/ en valt stil weg als die map verdwijnt.
          test -f .output/public/v2/index.html
          test -f .output/public/dashboard/index.html
          grep -q 'apiBase:"/api"' .output/public/index.html
