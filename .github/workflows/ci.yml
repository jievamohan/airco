name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Volledige historie: een geheim dat later is weggehaald staat er nog
          # steeds in en moet alsnog gevonden worden.
          fetch-depth: 0

      - name: Gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

  api:
    name: API tests and static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      # De tests draaien op MySQL, net als productie. Root zonder wachtwoord:
      # deze container leeft alleen tijdens deze job en is nergens anders
      # bereikbaar, en zo staat er geen wachtwoord in de repository.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: klimaatx_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, sodium, zip, dom
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Code style
        run: vendor/bin/pint --test

      - name: Static analysis
        run: php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress

      # Zelfde stand als de productie-VPS. Staat deze schakelaar aan — de
      # standaard van MySQL 8.4 — dan accepteert de testdatabase kolommen die
      # productie weigert, en zegt een groene run niets over de migratie daar.
      - name: Testdatabase op de stand van productie zetten
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -e "SET GLOBAL explicit_defaults_for_timestamp = OFF;"
          stand="$(mysql -h 127.0.0.1 -P 3306 -uroot -N -B -e 'SELECT @@explicit_defaults_for_timestamp;')"
          if [ "${stand}" != "0" ]; then
            echo "fout: explicit_defaults_for_timestamp staat op ${stand}; de tests" >&2
            echo "      missen dan precies de schemafouten die productie wel geeft." >&2
            exit 1
          fi
          echo "✓ explicit_defaults_for_timestamp = 0"

      - name: Tests
        run: vendor/bin/phpunit --no-coverage

      - name: Dependency audit
        run: composer audit --no-interaction --format=plain

  ci:
    name: Build and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --prod

      - name: Typecheck
        run: pnpm run typecheck

      - name: Generate static site
        env:
          # Site en API delen op productie één domein, dus de browser praat met
          # /api op dezelfde origin. Zelfde waarde als de deploy op de VPS.
          NUXT_PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE || '/api' }}
        run: pnpm run generate

      - name: Verify generate output
        run: |
          test -f .output/public/index.html
          test -d .output/public/_nuxt
          # Beide landingspagina's moeten in de build zitten: de tweede is een
          # statisch bestand in public/ en valt stil weg als die map verdwijnt.
          test -f .output/public/v2/index.html
          test -f .output/public/dashboard/index.html
          grep -q 'apiBase:"/api"' .output/public/index.html
