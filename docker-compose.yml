services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3010:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - CI=true
    command: sh -c "pnpm install --frozen-lockfile || pnpm install && pnpm run dev --host 0.0.0.0 --port 3000"

volumes:
  web_node_modules:
