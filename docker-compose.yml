services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3010:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - CI=true
      - NUXT_PUBLIC_API_BASE=http://localhost:8010/api
    command: sh -c "pnpm install --frozen-lockfile || pnpm install && pnpm run dev --host 0.0.0.0 --port 3000"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8010:8000"
    volumes:
      - ./apps/api:/app
      - api_vendor:/app/vendor
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8010
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=klimaatx
      - DB_USERNAME=klimaatx
      - DB_PASSWORD=klimaatx
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - MAIL_MAILER=log
      - DASHBOARD_ORIGINS=http://localhost:3010
      # Lokaal draait de agent standaard in proefmodus: geen echte gesprekken,
      # mails of agenda-afspraken.
      - AGENT_DRY_RUN=true
    command: ["sh", "/app/docker/start.sh", "api"]
    healthcheck:
      # Pas gezond als composer install, de migraties en de seed klaar zijn en
      # de webserver antwoordt. De agent hangt hieraan.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/up"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 240s

  # Hartslag van de workflow plus de wachtrij. Los van de webserver, zodat je
  # de agent kunt stilzetten zonder de API te stoppen.
  agent:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    volumes:
      - ./apps/api:/app
      - api_vendor:/app/vendor
    depends_on:
      api:
        # service_started wacht alleen tot de container draait, niet tot het
        # gedeelde vendor-volume gevuld is. Daarom service_healthy.
        condition: service_healthy
    environment:
      - APP_ENV=local
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=klimaatx
      - DB_USERNAME=klimaatx
      - DB_PASSWORD=klimaatx
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - MAIL_MAILER=log
      - AGENT_DRY_RUN=true
    command: ["sh", "/app/docker/start.sh", "agent"]

  db:
    image: mysql:8.4
    ports:
      - "3316:3306"
    environment:
      - MYSQL_DATABASE=klimaatx
      - MYSQL_USER=klimaatx
      - MYSQL_PASSWORD=klimaatx
      - MYSQL_ROOT_PASSWORD=klimaatx
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uklimaatx", "-pklimaatx"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  web_node_modules:
  api_vendor:
  db_data:
